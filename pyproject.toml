[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-intelligence"
version = "0.1.10"
description = "Recursive prompt improvement — VSR loop with linguistic gate (ri-engine CLI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "russfranky" }]
keywords = [
    "prompt-engineering",
    "system-prompts",
    "llm",
    "agents",
    "cli",
    "chatgpt",
    "claude",
    "copilot",
    "prompt-improvement",
    "open-source",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/russfranky/recursive-intelligence"
Documentation = "https://github.com/russfranky/recursive-intelligence/blob/main/docs/README.md"
Repository = "https://github.com/russfranky/recursive-intelligence"
Issues = "https://github.com/russfranky/recursive-intelligence/issues"
Changelog = "https://github.com/russfranky/recursive-intelligence/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
all = ["openai>=1.0", "anthropic>=0.25"]
prompts = []  # marker: repo uses ri-engine integrate workflow (no extra deps)

[project.scripts]
ri-engine = "ri_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ri_engine = ["bundled/**/*"]
