[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-intelligence"
version = "0.1.0"
description = "Prompt Improvement Studio — turn rough AI prompts into production-ready ones automatically"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
all = ["openai>=1.0", "anthropic>=0.25"]

[project.scripts]
ri-engine = "ri_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
